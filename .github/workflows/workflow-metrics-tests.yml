name: Workflow metrics tests

on:
  pull_request:
    paths:
      - "scripts/workflow_metrics.py"
      - "scripts/resume_assessment.py"
      - "tests/test_workflow_metrics.py"
      - "requirements-workflows.txt"
      - ".github/workflows/workflow-metrics-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/workflow_metrics.py"
      - "scripts/resume_assessment.py"
      - "tests/test_workflow_metrics.py"
      - "requirements-workflows.txt"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        run: python -m pip install -r requirements-workflows.txt

      - name: Compile workflow scripts
        run: python -m py_compile scripts/workflow_metrics.py scripts/resume_assessment.py

      - name: Run unit tests
        run: python -m unittest tests/test_workflow_metrics.py
